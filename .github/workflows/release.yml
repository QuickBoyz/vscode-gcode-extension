name: Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type'
        required: true
        default: 'minor'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get latest tag
        id: get_latest_tag
        run: |
          # Get the latest tag
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "Latest tag: $LATEST_TAG"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump_version
        run: |
          # Bump version using npm
          NEW_VERSION=$(npm version ${{ inputs.version_bump }} --no-git-tag-version)
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"

      - name: Promote [Unreleased] to new version in CHANGELOG
        run: |
          VERSION="${{ steps.bump_version.outputs.new_version }}"
          DATE=$(date +%Y-%m-%d)

          if [ ! -f CHANGELOG.md ]; then
            echo "::error::CHANGELOG.md not found"
            exit 1
          fi
          if ! grep -q '^## \[Unreleased\]$' CHANGELOG.md; then
            echo "::error::CHANGELOG.md missing [Unreleased] section"
            exit 1
          fi

          # Drop the #unreleased anchor (will be re-added later with the new Unreleased section)
          sed -i '/^<!-- #unreleased -->$/d' CHANGELOG.md
          # Rename the [Unreleased] heading to the released version + date
          sed -i "0,/^## \[Unreleased\]$/s//## [$VERSION] - $DATE/" CHANGELOG.md

      - name: Commit version bump
        run: |
          VERSION="${{ steps.bump_version.outputs.new_version }}"
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "chore: release $VERSION"
          git tag -a "$VERSION" -m "Release $VERSION"

      - name: Push changes
        run: |
          git push origin main
          git push origin ${{ steps.bump_version.outputs.new_version }}

      - name: Run tests
        run: npm test

      - name: Build extension
        run: npm run build

      - name: Generate screenshots (attempt 1)
        id: screenshots
        continue-on-error: true
        run: xvfb-run -a --server-args='-screen 0 1920x1080x24' npm run screenshots

      - name: Generate screenshots (retry once)
        id: screenshots_retry
        if: steps.screenshots.outcome == 'failure'
        continue-on-error: true
        run: xvfb-run -a --server-args='-screen 0 1920x1080x24' npm run screenshots

      - name: Commit screenshots if changed
        if: steps.screenshots.outcome == 'success' || steps.screenshots_retry.outcome == 'success'
        run: |
          if git diff --quiet images/screenshots/; then
            echo "No screenshot changes — skipping commit"
          else
            git add images/screenshots/
            git commit -m "chore: regenerate README screenshots for ${{ steps.bump_version.outputs.new_version }}"
            git push origin main
          fi

      - name: Warn on double failure
        if: steps.screenshots.outcome == 'failure' && steps.screenshots_retry.outcome == 'failure'
        run: echo "::warning::Screenshots failed twice; release proceeds with previously committed PNGs"

      - name: Package extension
        id: package
        run: |
          npx vsce package
          VSIX_FILE=$(ls *.vsix)
          echo "vsix_path=$VSIX_FILE" >> $GITHUB_OUTPUT
          echo "Packaged: $VSIX_FILE"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.bump_version.outputs.new_version }}"
          VSIX_FILE="${{ steps.package.outputs.vsix_path }}"

          gh release create "$VERSION" \
            "$VSIX_FILE" \
            --draft \
            --title "$VERSION" \
            --generate-notes

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -n "$VSCE_PAT" ]; then
            npx vsce publish -p $VSCE_PAT
            echo "✅ Published to VS Code Marketplace"
          else
            echo "⚠️ VSCE_PAT secret not set. Skipping marketplace publication."
            echo "To publish to the marketplace, add VSCE_PAT to repository secrets."
          fi

      - name: Reopen [Unreleased] section in CHANGELOG
        run: |
          VERSION="${{ steps.bump_version.outputs.new_version }}"

          awk '
            BEGIN { inserted = 0 }
            /^<!-- #released -->$/ { next }
            /^## \[/ && !inserted {
              print "<!-- #unreleased -->"
              print "## [Unreleased]"
              print ""
              print "### Added"
              print "<!-- New features and improvements -->"
              print ""
              print "### Changed"
              print "<!-- Updates and modifications -->"
              print ""
              print "### Fixed"
              print "<!-- Bug fixes -->"
              print ""
              print "<!-- #released -->"
              inserted = 1
            }
            { print }
          ' CHANGELOG.md > CHANGELOG.md.tmp && mv CHANGELOG.md.tmp CHANGELOG.md

          git add CHANGELOG.md
          git commit -m "chore: reopen [Unreleased] section after $VERSION"
          git push origin main

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ steps.bump_version.outputs.new_version }}
          path: |
            *.vsix
            package.json
          retention-days: 30
